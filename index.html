<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bull</title>
<meta name="theme-color" content="#faf6ef">
<meta name="description" content="Relapse prevention and sexual vigour tracker.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="preview-b-bull.png">
<link rel="apple-touch-icon" href="preview-b-bull.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bull">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700;6..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body { background:#faf6ef; margin:0; overscroll-behavior-y: none; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  /* Display face. Bodoni is a Didone — its hairlines thin out badly at small sizes,
     so it stays at 700 and is only ever used for headings and titles. */
  .font-serif { font-family: 'Bodoni Moda', serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  /* Tailwind's own font-mono was never remapped, so these were silently falling back
     to the system mono — a third typeface. Pointed at Inter, with tabular figures so
     stat columns and calendar digits still line up. */
  .font-mono { font-family: 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #root { min-height: 100vh; }
</style>
</head>

<body>
<div id="root"></div>

<script type="module" src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
